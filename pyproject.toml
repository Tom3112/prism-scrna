[project]
name = "prism"
version = "0.1.0"
description = "PRISM: PPI-augmented RNA Inference and Single-cell Modeling — transformer + GAT foundation model for scRNA-seq"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "scanpy>=1.9.0",
    "anndata>=0.10.0",
    "umap-learn>=0.5.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "leidenalg>=0.10.0",
    "python-igraph>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data", "model", "train", "eval"]

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]
